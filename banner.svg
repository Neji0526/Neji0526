<g class="orbit2"><circle cx="929" cy="203" r="94" fill="none" stroke="#7778c9" stroke-opacity=".4" stroke-dasharray="3 10"/><circle cx="1023" cy="203" r="3.5" fill="#b69aff"/></g>
<path class="link" d="M929 203L785 116 M929 203L1070 116 M929 203L785 289 M929 203L1070 289"/>
