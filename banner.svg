<text x="57" y="127" font-size="76" font-weight="800" letter-spacing="6" fill="#f4f7ff">NEJI<tspan fill="url(#neon)">.</tspan></text>
<rect x="58" y="143" width="46" height="3" rx="1.5" fill="url(#neon)"><animate attributeName="width" values="46;120;46" dur="5s" repeatCount="indefinite"/></rect>
