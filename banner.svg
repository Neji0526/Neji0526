<g class="node"><rect x="723" y="87" width="132" height="57" rx="12"/><rect x="1005" y="87" width="132" height="57" rx="12"/><rect x="723" y="260" width="132" height="57" rx="12"/><rect x="1005" y="260" width="132" height="57" rx="12"/></g>
<g text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#e4edff"><text x="789" y="111">AI / AGENTS</text><text x="1071" y="111">APPLICATIONS</text><text x="789" y="284">DATA LAYER</text><text x="1071" y="284">CLOUD / OPS</text></g>
<g text-anchor="middle" font-size="10" fill="#8faacc"><text x="789" y="128">LLM · RAG</text><text x="1071" y="128">WEB · APIs</text><text x="789" y="301">SQL · VECTOR</text><text x="1071" y="301">DEPLOY · SCALE</text></g>
