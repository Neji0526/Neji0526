<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="NEJI senior AI full stack engineer animated portfolio banner">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".55" stop-color="#101b34"/><stop offset="1" stop-color="#090f20"/></linearGradient>
 <linearGradient id="neon" x2="1"><stop stop-color="#51e5ff"/><stop offset=".52" stop-color="#7e9bff"/><stop offset="1" stop-color="#b78cff"/></linearGradient>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#182845"/><stop offset="1" stop-color="#10192d"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#3474c9" stop-opacity=".32"/><stop offset="1" stop-color="#3474c9" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#6485b7" stroke-opacity=".11"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif} .muted{fill:#90a3c3} .white{fill:#f3f7ff} .small{font-size:12px;letter-spacing:2.2px} .mono{font-family:Consolas,Menlo,monospace} .node{fill:#13243f;stroke:#486c9b;stroke-width:1.3} .link{fill:none;stroke:#47678d;stroke-width:1.5;stroke-dasharray:5 7;animation:flow 4s linear infinite} .orbit{transform-origin:929px 203px;animation:spin 36s linear infinite} .orbit2{transform-origin:929px 203px;animation:spin 25s linear infinite reverse} .blink{animation:blink 3s ease-in-out infinite} .rise{animation:rise 5s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-72}} @keyframes spin{to{transform:rotate(360deg)}} @keyframes blink{50%{opacity:.3}} @keyframes rise{50%{transform:translateY(-5px)}}
 </style>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
<rect width="1200" height="420" rx="22" fill="url(#grid)"/>
<circle cx="940" cy="196" r="250" fill="url(#halo)"/>
<path d="M0 62H1200 M0 357H1200" stroke="#334a6e" stroke-opacity=".55"/>
