 <rect x="160" width="137" height="34" rx="17" fill="#192b4a" stroke="#425d9d"/><text x="177" y="22" fill="#c9d9ff" font-size="11" font-weight="600" letter-spacing="1">FULL STACK</text>
 <rect x="309" width="157" height="34" rx="17" fill="#241d42" stroke="#71549e"/><text x="326" y="22" fill="#e1d2ff" font-size="11" font-weight="600" letter-spacing="1">CLOUD SYSTEMS</text>
</g>
